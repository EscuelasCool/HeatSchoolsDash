# Cloudflare Workers: sirve el export estático de Next.js (carpeta out/).
# Build con basePath /escuelascooldash → rutas bajo out/escuelascooldash/.
# En el dashboard CF: route escuelascool.org/escuelascooldash* → este worker.
name = "mockup-hsd"
compatibility_date = "2024-09-23"

[assets]
directory = "out"
not_found_handling = "single-page-application"
