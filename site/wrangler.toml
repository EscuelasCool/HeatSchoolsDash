# Cloudflare Workers: sirve el export estático de Next.js (carpeta out/).
# Build con basePath /escuelascooldash → rutas bajo out/escuelascooldash/.
# URL workers.dev (subdominio de cuenta «escuelascool»): https://dash.escuelascool.workers.dev/escuelascooldash/
# Ruta futura en escuelascool.org: escuelascool.org/escuelascooldash* → este worker (cuenta del proyecto).
name = "dash"
compatibility_date = "2024-09-23"

[assets]
directory = "out"
not_found_handling = "single-page-application"
